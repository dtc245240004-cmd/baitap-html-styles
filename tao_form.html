    // DOM Validation Rules Engine
    function validateHTMLCode(code, activePart) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(code, 'text/html');
      
      const checks = [];

      if (activePart === 'part1') {
        // Requirement 1: Form tag
        const formEl = doc.querySelector('form');
        checks.push({
          title: 'Thẻ <form> tồn tại',
          status: !!formEl,
          detail: formEl ? 'Tìm thấy thẻ <form> phù hợp.' : 'Thiếu thẻ <form> bao bọc các ô nhập liệu.'
        });

        // Requirement 2: Textbox name="yourname"
        const yourNameInput = doc.querySelector('input[name="yourname"]');
        checks.push({
          title: 'Input Họ và tên (name="yourname")',
          status: !!yourNameInput && (yourNameInput.getAttribute('type') === 'text' || !yourNameInput.getAttribute('type')),
          detail: yourNameInput ? 'Trường name="yourname" đã được định nghĩa đúng.' : 'Cần thẻ <input type="text" name="yourname">'
        });

        // Requirement 3: Textbox name="email"
        const emailInput = doc.querySelector('input[name="email"]');
        checks.push({
          title: 'Input Email (name="email")',
          status: !!emailInput,
          detail: emailInput ? 'Trường name="email" đã được định nghĩa đúng.' : 'Cần thẻ <input type="email" name="email">'
        });

        // Requirement 4: Checkboxes name="hobby"
        const hobbyCheckboxes = doc.querySelectorAll('input[type="checkbox"][name="hobby"]');
        checks.push({
          title: 'Danh sách Checkbox sở thích (name="hobby")',
          status: hobbyCheckboxes.length >= 2,
          detail: hobbyCheckboxes.length >= 2 
            ? `Tìm thấy ${hobbyCheckboxes.length} checkbox sở thích sử dụng chung name="hobby".` 
            : 'Cần ít nhất 2 checkbox có thuộc tính name="hobby".'
        });

        // Requirement 5: Submit button "Gửi thông tin"
        const submitBtn = doc.querySelector('button[type="submit"], input[type="submit"]');
        const submitText = submitBtn ? (submitBtn.innerText || submitBtn.value || '').toLowerCase() : '';
        const hasSubmitKey = submitText.includes('gửi') || submitText.includes('gui') || submitText.includes('submit');
        checks.push({
          title: 'Nút Submit "Gửi thông tin"',
          status: !!submitBtn && hasSubmitKey,
          detail: (submitBtn && hasSubmitKey) ? 'Nút Submit đúng chuẩn type="submit" với nội dung phù hợp.' : 'Cần nút submit với chữ "Gửi thông tin".'
        });

        // Requirement 6: Reset button "Nhập lại"
        const resetBtn = doc.querySelector('button[type="reset"], input[type="reset"]');
        const resetText = resetBtn ? (resetBtn.innerText || resetBtn.value || '').toLowerCase() : '';
        const hasResetKey = resetText.includes('nhập') || resetText.includes('nhap') || resetText.includes('reset') || resetText.includes('lại');
        checks.push({
          title: 'Nút Reset "Nhập lại"',
          status: !!resetBtn && hasResetKey,
          detail: (resetBtn && hasResetKey) ? 'Nút Reset đúng chuẩn type="reset".' : 'Cần nút reset type="reset" với chữ "Nhập lại".'
        });

        // Requirement 7: CSS styling present
        const styleTag = doc.querySelector('style') || doc.querySelector('link[rel="stylesheet"]');
        checks.push({
          title: 'Định dạng CSS & Căn chỉnh',
          status: !!styleTag,
          detail: styleTag ? 'Có thể thấy thẻ CSS <style> hỗ trợ giao diện.' : 'Nên thêm CSS căn chỉnh màu sắc, phông chữ và bố cục.'
        });

      } else { // Part 2
        // Form tag
        const formEl = doc.querySelector('form');
        checks.push({
          title: 'Thẻ <form> tồn tại',
          status: !!formEl,
          detail: formEl ? 'Đã tìm thấy form đăng ký.' : 'Thiếu thẻ <form>.'
        });

        // Fullname
        const fullname = doc.querySelector('[name="fullname"]');
        checks.push({
          title: 'Trường Họ tên (fullname)',
          status: !!fullname,
          detail: fullname ? 'Đã tìm thấy input[name="fullname"]' : 'Cần input tên Tiếng Anh name="fullname"'
        });

        // Email
        const email = doc.querySelector('[name="email"]');
        checks.push({
          title: 'Trường Email (email)',
          status: !!email,
          detail: email ? 'Đã tìm thấy input[name="email"]' : 'Cần input name="email"'
        });

        // Phone
        const phone = doc.querySelector('[name="phone"]');
        checks.push({
          title: 'Trường Số điện thoại (phone)',
          status: !!phone,
          detail: phone ? 'Đã tìm thấy input[name="phone"]' : 'Cần input name="phone"'
        });

        // Date of Birth
        const dob = doc.querySelector('[name="dob"]');
        checks.push({
          title: 'Trường Ngày sinh (dob)',
          status: !!dob,
          detail: dob ? 'Đã tìm thấy input[name="dob"]' : 'Cần input name="dob"'
        });

        // Gender (radios)
        const genderRadios = doc.querySelectorAll('input[type="radio"][name="gender"]');
        checks.push({
          title: 'Giới tính Radio Group (gender)',
          status: genderRadios.length >= 2,
          detail: genderRadios.length >= 2 ? `Tìm thấy ${genderRadios.length} lựa chọn giới tính (gender).` : 'Cần các input radio name="gender".'
        });

        // Course (<select>)
        const courseSelect = doc.querySelector('select[name="course"]');
        checks.push({
          title: 'Thẻ <select> chọn khóa học (course)',
          status: !!courseSelect && courseSelect.options.length >= 2,
          detail: courseSelect ? 'Đã khai báo thẻ select name="course" chứa các khóa học.' : 'Cần thẻ <select name="course"> với các thẻ <option>.'
        });

        // Address (<textarea> or input)
        const address = doc.querySelector('[name="address"]');
        checks.push({
          title: 'Trường Địa chỉ (address)',
          status: !!address,
          detail: address ? 'Đã tìm thấy trường name="address".' : 'Cần <textarea name="address">'
        });

        // Notes (<textarea> or input)
        const notes = doc.querySelector('[name="notes"]');
        checks.push({
          title: 'Trường Ghi chú (notes)',
          status: !!notes,
          detail: notes ? 'Đã tìm thấy trường name="notes".' : 'Cần <textarea name="notes">'
        });

        // Submit & Reset
        const submitBtn = doc.querySelector('button[type="submit"], input[type="submit"]');
        const resetBtn = doc.querySelector('button[type="reset"], input[type="reset"]');
        checks.push({
          title: 'Nút bấm Submit & Reset',
          status: !!submitBtn && !!resetBtn,
          detail: (submitBtn && resetBtn) ? 'Có đầy đủ cả nút Submit và Reset.' : 'Thiếu nút type="submit" hoặc type="reset".'
        });
      }

      const passedCount = checks.filter(c => c.status).length;
      const score = Math.round((passedCount / checks.length) * 100);

      return { checks, score, passedCount, total: checks.length };
    }

    // Main App Component
    function App() {
      const [activePart, setActivePart] = useState('part1'); // 'part1' | 'part2'
      const [part1Code, setPart1Code] = useState(DEFAULT_PART1_CODE);
      const [part2Code, setPart2Code] = useState(DEFAULT_PART2_CODE);
      const [activeTab, setActiveTab] = useState('editor'); // 'editor' | 'validator' | 'inspector' | 'cheatsheet' | 'submission'
      const [viewMode, setViewMode] = useState('split'); // 'split' | 'code' | 'preview'
      const [lastSubmission, setLastSubmission] = useState(null);
      const [toast, setToast] = useState(null);

      const currentCode = activePart === 'part1' ? part1Code : part2Code;
      const setCurrentCode = activePart === 'part1' ? setPart1Code : setPart2Code;

      // Handle message from iframe (intercept form submit/reset)
      useEffect(() => {
        function handleIframeMessage(e) {
          if (!e.data || typeof e.data !== 'object') return;
          if (e.data.type === 'FORM_SUBMIT') {
            setLastSubmission({
              timestamp: new Date().toLocaleTimeString(),
              part: activePart,
              method: e.data.method || 'GET',
              action: e.data.action || '#',
              data: e.data.data || []
            });
            showToast('Dữ liệu form đã được bắt thành công!', 'success');
          } else if (e.data.type === 'FORM_RESET') {
            showToast('Form vừa được làm mới (Reset)!', 'info');
          }
        }
        window.addEventListener('message', handleIframeMessage);
        return () => window.removeEventListener('message', handleIframeMessage);
      }, [activePart]);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleResetDefault = () => {
        if (activePart === 'part1') setPart1Code(DEFAULT_PART1_CODE);
        else setPart2Code(DEFAULT_PART2_CODE);
        showToast('Đã khôi phục mã nguồn ban đầu!', 'info');
      };

      const handleCopyCode = () => {
        navigator.clipboard.writeText(currentCode);
        showToast('Đã chép mã nguồn vào bộ nhớ tạm!', 'success');
      };

      const handleDownload = () => {
        const element = document.createElement("a");
        const file = new Blob([currentCode], {type: 'text/html'});
        element.href = URL.createObjectURL(file);
        element.download = activePart === 'part1' ? "part1.html" : "part2.html";
        document.body.appendChild(element);

              forms.forEach(form => {
                form.addEventListener('submit', (e) => {
                  e.preventDefault();
                  const formData = new FormData(form);
                  const entries = [];
                  for (let [key, val] of formData.entries()) {
                    entries.push([key, val]);
                  }
                  window.parent.postMessage({
                    type: 'FORM_SUBMIT',
                    method: (form.getAttribute('method') || 'GET').toUpperCase(),
                    action: form.getAttribute('action') || '#',
                    data: entries
                  }, '*');
                });
                form.addEventListener('reset', () => {
                  window.parent.postMessage({ type: 'FORM_RESET' }, '*');
                });
              });
            });
          <\/script>
        `;
        if (rawCode.includes('</body>')) {
          return rawCode.replace('</body>', `${interceptorScript}</body>`);
        }
        return rawCode + interceptorScript;

                    <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                      <span className="font-semibold text-indigo-400 block mb-1">3. Fieldset & Legend</span>
                      <p className="text-slate-400">Gộp nhóm thông tin bằng thẻ <code className="text-slate-200">&lt;fieldset&gt;</code> và tạo tiêu đề nhóm bằng <code className="text-slate-200">&lt;legend&gt;</code>.</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: GITHUB SUBMISSION ASSISTANT */}
            {activeTab === 'submission' && (
              <div className="h-full overflow-y-auto p-6 max-w-4xl mx-auto space-y-6">
                <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-6">
                  <h2 className="text-lg font-bold text-slate-100 mb-1 flex items-center gap-2">
                    <span>🚀</span> Hướng Dẫn Nộp Bài Từng Bước
                  </h2>
                  <p className="text-xs text-slate-400">
                    Lưu các file <code className="text-blue-300">part1.html</code> và <code className="text-teal-300">part2.html</code> vào thư mục dự án và thực hiện các lệnh Git bên dưới để đẩy bài lên GitHub.
                  </p>
                </div>

                {/* Git Step-by-Step */}
                <div className="space-y-4">
                  {[
                    {
                      step: 'Bước 1',
                      title: 'Khởi tạo Repository trong thư mục chứa file bài tập',
                      cmd: 'git init'
                    },
                    {
                      step: 'Bước 2',
                      title: 'Thêm file part1.html và part2.html vào Staging Area',
                      cmd: 'git add part1.html part2.html'
                    },
                    {
                      step: 'Bước 3',
                      title: 'Tạo Commit đầu tiên cho bài tập',
                      cmd: 'git commit -m "Completing simple HTML forms assignment Part 1 and Part 2"'
                    },
                    {
                      step: 'Bước 4',
                      title: 'Liên kết với kho chứa trên GitHub & Push bài làm',
                      cmd: 'git branch -M main\ngit remote add origin https://github.com/USERNAME/html-form-assignment.git\ngit push -u origin main'
                    }
                  ].map((item, idx) => (
                    <div key={idx} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="px-2 py-0.5 rounded bg-blue-900/60 text-blue-300 text-[10px] font-bold uppercase">{item.step}</span>
                          <span className="text-xs font-semibold text-slate-200">{item.title}</span>
                        </div>
                        <pre className="p-2.5 bg-slate-900 rounded-lg text-xs font-mono text-emerald-400 whitespace-pre-wrap border border-slate-800/80">
                          {item.cmd}
                        </pre>
                      </div>

                      <button
                        onClick={() => {
                          navigator.clipboard.writeText(item.cmd);
                          showToast(`Đã chép câu lệnh ${item.step}!`, 'success');
                        }}
                        className="self-start md:self-center px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition shrink-0 border border-slate-700"
                      >
                        Sao chép
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
