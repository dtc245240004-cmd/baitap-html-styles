<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Đăng Ký Tài Khoản - Bootstrap Forms</title>
    <!-- Nhúng Bootstrap 5.3.0 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-4 py-md-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Card bao quanh form -->
                <div class="card border-0 shadow-lg rounded-3">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- Tiêu đề & Nội dung hướng dẫn (Bootstrap Text formatting) -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary mb-1">Đăng Ký Tài Khoản</h2>
                            <p class="text-muted small">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới</p>
                        </div>

                        <!-- Form Đăng Ký -->
                        <form action="#" method="POST">
                            
                            <!-- 1. Họ và tên -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                            </div>

                            <!-- 2. Email -->
                            <div class="mb-3">
                                <label for="emailInput" class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="emailInput" placeholder="example@domain.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không chia sẻ email của bạn với bất kỳ ai.</div>
                            </div>

                            <!-- 3. Mật khẩu & 4. Xác nhận mật khẩu (Hàng 2 cột trên desktop) -->
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-sm-6">
                                    <label for="passwordInput" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="passwordInput" placeholder="••••••••" required>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label for="confirmPasswordInput" class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="confirmPasswordInput" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- 5. Giới tính (Radio buttons) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Giới tính <span class="text-danger">*</span></label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkboxes) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyCode" value="coding">
                                    <label class="form-check-label" for="hobbyCode">Lập trình</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyRead" value="reading">
                                    <label class="form-check-label" for="hobbyRead">Đọc sách</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyTravel" value="traveling">
                                    <label class="form-check-label" for="hobbyTravel">Du lịch</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="countrySelect" class="form-label fw-semibold">Quốc gia <span class="text-danger">*</span></label>
                                <select class="form-select" id="countrySelect" required>
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Mỹ</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                    <option value="OTHER">Khác</option>
                                </select>
                            </div>

                            <!-- Đồng ý điều khoản -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label text-muted small" for="termsCheck">
                                    Tôi đồng ý với các <a href="#" class="text-decoration-none">Điều khoản & Điều kiện</a> sử dụng.
                                </label>
                            </div>

                            <!-- 8. Nút Submit (Bootstrap Button) -->
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Đăng Ký Ngay</button>

                        </form>

                        <!-- Footer phụ của card -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">Đã có tài khoản? <a href="#" class="text-primary fw-semibold text-decoration-none">Đăng nhập ngay</a></p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5.3.0 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
