<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu ngang Dropdown</title>

    <style>
        /* =========================
           THIẾT LẬP CHUNG
           ========================= */

        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }


        /* =========================
           KHUNG MENU
           ========================= */

        #menu {
            width: 100%;
            height: 50px;
            background-color: #333;
            border: 1px solid #222;
        }


        /* =========================
           MENU CHÍNH
           ========================= */

        #menu > ul {
            list-style: none;
        }

        #menu > ul > li {
            float: left;
            position: relative;
        }


        /* =========================
           LINK TRONG MENU
           ========================= */

        #menu a {
            width: 120px;
            height: 50px;
            display: block;

            color: white;
            text-decoration: none;
            text-align: center;

            line-height: 50px;
        }


        /* =========================
           HOVER MENU
           ========================= */

        #menu a:hover {
            background-color: red;
        }


        /* =========================
           MENU CON
           ========================= */

        #menu ul ul {
            position: absolute;
            top: 50px;
            left: 0;

            list-style: none;
            background-color: #333;

            visibility: hidden;
        }


        /* =========================
           HIỂN THỊ MENU CON
           ========================= */

        #menu ul li:hover > ul {
            visibility: visible;
        }


        /* =========================
           CÁC MỤC MENU CON
           ========================= */

        #menu ul ul li {
            position: relative;
        }

        #menu ul ul a {
            width: 150px;
            height: 45px;
            line-height: 45px;
        }
    </style>
</head>

<body>

    <div id="menu">

        <ul>

            <li>
                <a href="#">Trang chủ</a>
            </li>

            <li>
                <a href="#">Sản phẩm</a>

                <!-- Menu con -->
                <ul>
                    <li>
                        <a href="#">Điện thoại</a>
                    </li>

                    <li>
                        <a href="#">Laptop</a>
                    </li>

                    <li>
                        <a href="#">Máy tính bảng</a>
                    </li>
                </ul>
            </li>

            <li>
                <a href="#">Dịch vụ</a>

                <!-- Menu con -->
                <ul>
                    <li>
                        <a href="#">Bảo hành</a>
                    </li>

                    <li>

                    </li>

                    <li>

                    </li>
                </ul>
            </li>

            <li>

</body>
