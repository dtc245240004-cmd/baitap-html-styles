```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trang web của tôi</title>

    <style>
        /* =========================
           ELEMENT SELECTOR
           ========================= */

        body {
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
        }

        h2 {
            color: #2563eb;
        }


        /* =========================
           ID SELECTOR
           ========================= */

        #title {
            text-align: center;
            color: #2563eb;
        }


        /* =========================
           CLASS SELECTOR
           ========================= */

        .intro {
            color: #333333;
            font-size: 18px;
            line-height: 1.6;
        }


        /* =========================
           GROUPING SELECTOR
           ========================= */

        h2, button {
            font-weight: bold;
        }


        /* =========================
           ĐỊNH DẠNG DANH SÁCH
           ========================= */

        .hobby-1 {
            color: #e11d48;
        }

        .hobby-2 {
            color: #16a34a;
        }

        .hobby-3 {
            color: #7c3aed;
        }


        /* =========================
           ĐỊNH DẠNG BUTTON
           ========================= */

        #myButton {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }


        /* =========================
           PSEUDO-CLASS :hover
           ========================= */

        #myButton:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <!-- Tiêu đề -->
    <h1 id="title">Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân -->
    <p class="intro">
        Xin chào! Mình là một người yêu thích công nghệ và đang học lập trình Web.
        Mình luôn cố gắng học hỏi những kiến thức mới mỗi ngày.
    </p>

    <!-- Danh sách sở thích -->
    <h2>Sở thích của tôi</h2>

    <ul>
        <li class="hobby-1">Nghe nhạc</li>
        <li class="hobby-2">Xem phim</li>
        <li class="hobby-3">Lập trình</li>
    </ul>

    <!-- Nút bấm -->
    <button id="myButton">Nhấn vào đây</button>

</body>
</html>
```
