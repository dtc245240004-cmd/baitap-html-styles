```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Market Research Survey</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            color: #333;
        }

        .survey-container {
            max-width: 750px;
            margin: 0 auto;
            background-color: white;
            padding: 35px 45px;
            border-radius: 6px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
            color: #333;
            font-size: 30px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label.question {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        select {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: Arial, Helvetica, sans-serif;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .options label {
            font-weight: normal;
            cursor: pointer;
        }

        .options input {
            margin-right: 8px;
        }

        .product-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .price {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .price input {
            width: 80px;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .rating-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .rating-table th,
        .rating-table td {
            border: 1px solid #ccc;
            padding: 12px 8px;
            text-align: center;
        }

        .rating-table th {
            background-color: #f5f5f5;
            font-size: 14px;
        }

        .rating-table td:first-child {
            text-align: left;
        }

        .rating-table input {
            cursor: pointer;
        }

        .submit-area {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 4px;
            background-color: #337ab7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #286090;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .survey-container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .rating-table {
                font-size: 12px;
            }

            .rating-table th,
            .rating-table td {
                padding: 8px 4px;
            }
        }
    </style>
</head>

<body>

    <div class="survey-container">

        <h1>Market Research Survey</h1>

        <p class="description">
            Please take a few moments to complete this satisfaction survey.
        </p>

        <form>

            <!-- Độ tuổi -->
            <div class="form-group">

                <label class="question" for="age">
                    What is your age range?
                </label>

                <select id="age" name="age">
                    <option value="">Select</option>
                    <option value="under18">Under 18</option>
                    <option value="18-24">18 - 24</option>
                    <option value="25-34">25 - 34</option>
                    <option value="35-44">35 - 44</option>
                    <option value="45-54">45 - 54</option>
                    <option value="55-64">55 - 64</option>
                    <option value="65plus">65+</option>
                </select>

            </div>


            <!-- Thu nhập -->
            <div class="form-group">

                <label class="question" for="income">
                    What is your yearly income range?
                </label>

                <select id="income" name="income">
                    <option value="">Select</option>
                    <option value="under25">Under $25,000</option>
                    <option value="25-50">$25,000 - $50,000</option>
                    <option value="50-75">$50,000 - $75,000</option>
                    <option value="75-100">$75,000 - $100,000</option>
                    <option value="100-150">$100,000 - $150,000</option>
                    <option value="150plus">$150,000+</option>
                </select>

            </div>


            <!-- Giới tính -->
            <div class="form-group">

                <label class="question">
                    Gender Identity
                </label>

                <div class="options">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="male"
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="nonbinary"
                        >
                        Nonbinary
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="other"
                        >
                        Other
                    </label>

                    <input
                        type="text"
                        name="gender_other"
                        maxlength="250"
                        placeholder="If other, please specify"
                    >

                </div>

            </div>


            <!-- Sản phẩm đã mua -->
            <div class="form-group">

                <label class="question">
                    Which of the following products have you purchased
                    in the last 2 months? Please check all that apply.
                </label>

                <div class="product-options">

                    <label>
                        <input
                            type="checkbox"
                            name="product1"
                            value="Product 1"
                        >
                        Product 1
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="product2"
                            value="Product 2"
                        >
                        Product 2
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="product3"
                            value="Product 3"
                        >
                        Product 3
                    </label>

                </div>

            </div>


            <!-- Tần suất sử dụng -->
            <div class="form-group">

                <label class="question">
                    How often would you use our new product?
                </label>

                <div class="options">

                    <label>
                        <input
                            type="radio"
                            name="frequency"
                            value="daily"
                        >
                        Daily
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="frequency"
                            value="weekly"
                        >
                        Weekly
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="frequency"
                            value="monthly"
                        >
                        Monthly
                    </label>

                </div>

            </div>


            <!-- Mức giá -->
            <div class="form-group">

                <label class="question">
                    What would you pay for the new product?
                </label>

                <div class="price">

                    <span>$</span>

                    <input
                        type="number"
                        name="dollars"
                        min="0"
                        placeholder="Dollars"
                    >

                    <span>.</span>

                    <input
                        type="number"
                        name="cents"
                        min="0"
                        max="99"
                        placeholder="Cents"
                    >

                </div>

            </div>


            <!-- Tính năng -->
            <div class="form-group">

                <label class="question" for="features">
                    What features would you like to see in the new product?
                </label>

                <textarea
                    id="features"
                    name="features"
                    placeholder="Enter your answer here..."
                ></textarea>

            </div>


            <!-- Bảng đánh giá -->
            <div class="form-group">

                <label class="question">
                    Please rate your level of agreement with the following statements.
                </label>

                <table class="rating-table">

                    <thead>
                        <tr>
                            <th></th>
                            <th>Strongly<br>Disagree</th>
                            <th>Disagree</th>
                            <th>Agree</th>
                            <th>Strongly<br>Agree</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>
                                Our products are priced fairly.
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="price_rating"
                                    value="1"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="price_rating"
                                    value="2"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="price_rating"
                                    value="3"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="price_rating"
                                    value="4"
                                >
                            </td>
                        </tr>


                        <tr>
                            <td>
                                Our products are high quality.
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="quality_rating"
                                    value="1"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="quality_rating"
                                    value="2"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="quality_rating"
                                    value="3"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="quality_rating"
                                    value="4"
                                >
                            </td>
                        </tr>


                        <tr>
                            <td>
                                You would recommend our product to a friend or coworker.
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="recommend_rating"
                                    value="1"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="recommend_rating"
                                    value="2"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="recommend_rating"
                                    value="3"
                                >
                            </td>

                            <td>
                                <input
                                    type="radio"
                                    name="recommend_rating"
                                    value="4"
                                >
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- Nút gửi -->
            <div class="submit-area">

                <button type="submit">
                    Submit
                </button>

            </div>

        </form>

    </div>

</body>
</html>
```
