<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Navbar Practice</title>
    <!-- Nhúng Bootstrap 5.3.0 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

    <!-- Thanh điều hướng Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!-- Thương hiệu / Logo -->
            <a class="navbar-brand" href="#">MyWebsite</a>

            <!-- Nút Toggler mở menu trên giao diện Mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Danh sách các mục menu -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <!-- Dropdown Menu -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Services
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Web Design</a></li>
                            <li><a class="dropdown-item" href="#">SEO</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Nội dung minh họa trang web -->
    <div class="container mt-5">
        <div class="p-5 mb-4 bg-light rounded-3 text-center border">
            <h1 class="display-5 fw-bold">Thực hành Bootstrap Navbar</h1>
            <p class="fs-5 text-muted">
                Thanh điều hướng đã được tạo thành công với giao diện tối (dark theme), tích hợp menu thả xuống (dropdown) và tự động thu gọn trên thiết bị di động.
            </p>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5.3.0 JS Bundle CDN (cần thiết cho Dropdown và Toggler hoạt động) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
