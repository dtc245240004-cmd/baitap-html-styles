<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form đăng ký người dùng</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .form-container {
            width: 400px;
            margin: 0 auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .gender {
            display: flex;
            gap: 20px;
        }

        .gender label {
            font-weight: normal;
            display: inline;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h1>Đăng ký người dùng</h1>

        <form
            action="http://demo.codegym.vn/6/registration_form/register.php"
            method="POST"
        >

            <!-- Họ và tên -->
            <div class="form-group">
                <label for="name">Họ và tên:</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Nhập họ và tên"
                >
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Nhập email"
                >
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label for="phone">Số điện thoại:</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Nhập số điện thoại"
                >
            </div>

            <!-- Giới tính -->
            <div class="form-group">

                <label>Giới tính:</label>

                <div class="gender">
                    <div>
                        <input
                            type="radio"
                            id="male"
                            name="gender"
                            value="Nam"
                        >
                        <label for="male">Nam</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="female"
                            name="gender"
                            value="Nữ"
                        >
                        <label for="female">Nữ</label>
                    </div>
                </div>

            </div>

            <!-- Nút đăng ký -->
            <button type="submit">
                Đăng ký
            </button>

        </form>

    </div>

</body>
</html>
