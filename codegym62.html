<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi CSS Sang SASS/SCSS Theo Chuẩn</title>
    <style>
        /* ==========================================================================
           1. CẤU TRÚC THƯ MỤC VÀ MÃ NGUỒN SASS/SCSS CHUẨN (7-1 PATTERN)
           ==========================================================================
           
           📁 abstracts/_variables.scss
           --------------------------------------------------------------------------
           $primary-color: #0284c7;
           $text-color: #333333;
           $background-color: #f4f4f4;
           $border-color: #dddddd;
           $box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);

           📁 abstracts/_mixins.scss
           --------------------------------------------------------------------------
           @mixin button-style($bg-color) {
             background: $bg-color;
             color: #ffffff;
             padding: 10px 20px;
             border-radius: 5px;
             border: none;
             cursor: pointer;
             display: inline-block;
             text-decoration: none;
             font-weight: bold;
           }

           @mixin box-shadow {
             box-shadow: $box-shadow;
           }

           📁 base/_global.scss
           --------------------------------------------------------------------------
           body {
             font-family: Arial, sans-serif;
             color: $text-color;
             background: $background-color;
             line-height: 1.6;
             padding: 40px 0;
           }

           📁 layout/_container.scss
           --------------------------------------------------------------------------
           .container {
             width: 80%;
             max-width: 800px;
             margin: 0 auto;
           }

           📁 components/_buttons.scss
           --------------------------------------------------------------------------
           .button {
             @include button-style($primary-color);
             transition: background-color 0.3s ease;

             &:hover {
               background-color: darken($primary-color, 10%);
             }
           }

           📁 components/_cards.scss
           --------------------------------------------------------------------------
           .card {
             border: 1px solid $border-color;
             background: #ffffff;
             padding: 20px;
             border-radius: 8px;
             @include box-shadow;
             margin-bottom: 20px;

             h2 {
               margin-bottom: 10px;
               color: $primary-color;
             }

             p {
               margin-bottom: 15px;
             }
           }

           📁 main.scss (File tổng import tất cả partials)
           --------------------------------------------------------------------------
           @import "abstracts/variables";
           @import "abstracts/mixins";
           @import "base/global";
           @import "layout/container";
           @import "components/buttons";
           @import "components/cards";
        ========================================================================== */

        /* ==========================================================================
           2. KẾT QUẢ CSS ĐÃ ĐƯỢC BIÊN DỊCH TỪ MÃ SASS TRÊN ĐỂ TRÌNH DUYỆT THIẾT LẬP
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #333333;
            background: #f4f4f4;
            line-height: 1.6;
            padding: 40px 0;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            border: 1px solid #dddddd;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 10px;
            color: #0284c7;
        }

        .card p {
            margin-bottom: 15px;
            color: #555555;
        }

        .button {
            background: #0284c7;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background: #026597;
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Khối Card component áp dụng SASS mixin & variable -->
        <article class="card">
            <h2>Chuyển Đổi CSS Sang SASS Theo Chuẩn</h2>
            <p>Mã CSS ban đầu đã được tái cấu trúc hoàn toàn sang định dạng SCSS chuẩn với cấu trúc thư mục phân tách (abstracts, base, layout, components). Sử dụng thành công các Biến ($variables), Mixins (@mixin), và Nesting.</p>
            <a href="#" class="button">Khám Phá SASS</a>
        </article>
    </main>

</body>
</html>
