```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Box Model - CSS</title>

    <style>
        /* Thiết lập chung cho 3 thẻ */
        .card {
            width: 280px;
            height: 150px;
            padding: 20px;
            border: 5px solid #3498db;
            margin: 20px;
        }

        /* Thẻ thứ nhất */
        .card:nth-child(1) {
            box-sizing: content-box;
            background-color: #2ecc71;
        }

        /* Thẻ thứ hai */
        .card:nth-child(2) {
            box-sizing: border-box;
            background-color: #f1c40f;
        }

        /* Thẻ thứ ba */
        .card:nth-child(3) {
            box-sizing: border-box;
            background-color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="card">
        <h3>Thẻ 1 - Content Box</h3>
        <p>
            Thẻ này sử dụng box-sizing: content-box.
        </p>
    </div>

    <div class="card">
        <h3>Thẻ 2 - Border Box</h3>
        <p>
            Thẻ này sử dụng box-sizing: border-box.
        </p>
    </div>

    <div class="card">
        <h3>Thẻ 3 - Border Box</h3>
        <p>
            Thẻ này cũng sử dụng box-sizing: border-box.
        </p>
    </div>

</body>
</html>
