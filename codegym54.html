<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xây Dựng Trang Chủ - Bootstrap 5</title>

    <!-- Bước 1: Nhúng Bootstrap 5.3.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bước 1: Nhúng Font Awesome 6.5.2 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* Điều chỉnh chiều cao hình ảnh Carousel để hiển thị đẹp hơn */
        .carousel-item img {
            height: 450px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Bước 2: Tạo Navbar với Font Awesome -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-home me-2"></i>MyWebsite
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Bước 3: Tạo Hero Section với Carousel -->
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=1200&q=80" class="d-block w-100" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1200&q=80" class="d-block w-100" alt="Slide 2">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- Bước 4: Thêm Section với Flexbox -->
    <div class="d-flex justify-content-center align-items-center bg-light py-5 text-center shadow-sm">
        <h2 class="fw-bold text-primary mb-0">Chào mừng đến với trang web của chúng tôi!</h2>
    </div>

    <!-- Bước 5: Tạo Contact Form với Bootstrap Form -->
    <section id="contact" class="py-5">
        <div class="container" style="max-width: 600px;">
            <div class="card border-0 shadow-sm p-4">
                <h3 class="text-center fw-bold mb-4 text-dark">Liên hệ với chúng tôi</h3>
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Tên của bạn</label>
                        <input type="text" class="form-control" id="name" placeholder="Nhập tên" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Gửi</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 border-top border-secondary">
        <div class="container">
            <p class="mb-0 small text-secondary">&copy; 2026 MyWebsite. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bước 1: Nhúng Bootstrap 5.3.3 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
