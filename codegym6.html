```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Màu nền và ảnh nền</title>

    <style>
        /* =========================
           THIẾT LẬP CHUNG CHO TRANG
           ========================= */

        body {
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px;
        }


        /* =========================
           TIÊU ĐỀ
           ========================= */

        h1 {
            color: #2563eb;
        }


        /* =========================
           ĐOẠN VĂN
           ========================= */

        p {
            color: #333333;
            font-size: 18px;
        }


        /* =========================
           KHỐI DIV
           ========================= */

        div {
            /* Thêm ảnh nền */
            background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

            /* Không lặp lại ảnh */
            background-repeat: no-repeat;

            /* Ảnh phủ toàn bộ khối */
            background-size: cover;

            /* Căn giữa ảnh nền */
            background-position: center;

            /* Căn giữa nội dung */
            display: flex;
            justify-content: center;
            align-items: center;

            /* Kích thước khối */
            width: 80%;
            height: 300px;

            /* Căn khối ra giữa trang */
            margin: 30px auto;

            /* Màu chữ */
            color: white;

            /* Làm chữ dễ nhìn trên ảnh */
            font-size: 24px;
            font-weight: bold;

            /* Bo góc */
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <!-- Tiêu đề -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn -->
    <p>
        Đây là một trang web đơn giản được thiết kế bằng HTML và CSS.
        Trang web sử dụng màu nền và ảnh nền để tạo giao diện đẹp mắt.
    </p>

    <!-- Khối có ảnh nền -->
    <div>
        Nội dung quan trọng
    </div>

</body>
</html>
```
